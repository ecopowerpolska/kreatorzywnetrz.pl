# build-i-wdrozenie.yml — build Astro → GitHub Pages (kreatorzywnetrz.pl)
#
# 🔴 WERSJE AKCJI TO LICZNIKI STANU, NIE STAŁE
#    (odczyt u źródła docs.astro.build/en/guides/deploy/github/ 2026-09-04, w użyciu do 2026-11-06).
#    Zapis starszy niż 30 dni weryfikuj u źródła; nie podnoś wersji "na wyczucie".
#
# 🔴 ŻADNEGO SEKRETU w GitHub Secrets tego repozytorium. Pages autoryzuje się tokenem wydawanym
#    na czas przebiegu (permissions niżej). Przepływ niczego nie zapisuje do repozytorium.
#
# Dwa zadania, jedno po drugim (needs): build → deploy.
# Linki wychodzące pilnuje scripts/sprawdz-linki-firm.mjs w `npm run guard:build` (czerwony = brak wdrożenia).
#
# 🔴 PUŁAPKA 60 DNI: GitHub wyłącza przepływy z `schedule` w repozytorium PUBLICZNYM po 60 dniach
#    bez aktywności w repo. Aktywność to commity (nowe wpisy, zmiany kodu); przebiegi z harmonogramu
#    jej nie dają. Gdy wpisy ustaną na dwa miesiące, harmonogram gaśnie po cichu i wpisy zaplanowane
#    przestają wychodzić: wtedy wystarczy uruchomić przepływ ręcznie (Actions → Run workflow,
#    `workflow_dispatch`) albo dać dowolny commit — to wznawia harmonogram.

name: build-i-wdrozenie

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Trzy przebiegi dziennie (03:17, 07:47 i 11:23 UTC), poza pełną godziną: GitHub spóźnia `schedule` nawet o godziny,
  # a pojedynczy przebieg bywał pomijany. Każdy publikuje wpisy, których data już minęła (filtr opublikowane() liczy
  # "teraz" w chwili budowania); bez zmian wypuszcza to samo.
  schedule:
    - cron: '17 3 * * *'
    - cron: '47 7 * * *'
    - cron: '23 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Dwa wgrania nie mogą biec naraz; trwającego nie przerywamy w połowie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Node w wersji z .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Walidator ma zero zależności, więc biegnie PRZED instalacją.
      # Czerwony guard zatrzymuje wdrożenie — to jest bramka, nie usterka.
      - name: astro-guard — walidator kodu źródłowego
        run: npm run guard

      - name: Instalacja, build i spakowanie artefaktu
        uses: withastro/action@v6

      - name: astro-guard — audyt dist
        run: npm run guard:build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wdrożenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
